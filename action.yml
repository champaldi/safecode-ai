name: SafeCode AI
description: Scan the lines changed in a pull request, filter false positives, suggest fixes.
inputs:
  language: {description: "ru | en", default: ru}
  fail-on: {description: "critical | high | medium", default: high}
  api-url: {description: "Dashboard base URL (optional)", default: ""}
  ingest-token: {description: "Bearer token for /api/ingest (optional)", default: ""}
  anthropic-api-key: {description: "Enables the optional LLM verdict (optional)", default: ""}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: SafeCode AI scan
      shell: bash
      # Needs: permissions contents: read, pull-requests: write, checks: write.
      # Checkout the PR head (ref: github.event.pull_request.head.sha) so line numbers match the diff.
      run: python -m action_runner
      env:
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_INGEST_TOKEN: ${{ inputs.ingest-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
